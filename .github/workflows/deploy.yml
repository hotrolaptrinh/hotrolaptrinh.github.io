name: Deploy Astro to GitHub Pages

on:
  push:
    branches: [ main ]   # hoặc branch bạn dùng
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@v4

      - name: Setup Node 🧬
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
